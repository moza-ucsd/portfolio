<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="projects.js" type="module"></script>

</head>
<body>
    <h1 class="projects-title"> Projects</h1>

    <!-- Step 1-3: pie chart of projects per year, with a legend beside it -->
    <div class="container">
        <svg id="projects-pie-plot" viewBox="-50 -50 100 100" role="img" aria-label="Pie chart of projects per year"></svg>
        <ul class="legend"></ul>
    </div>

    <!-- Step 4: search -->
    <input
        class="searchBar"
        type="search"
        aria-label="Search projects"
        placeholder="  🔍 Search projects…"
    />

    <div class="projects">
        <!-- Projects are rendered here by projects.js -->
    </div>
</body>
</html>
